name: Site CI

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'partner-kit.html'
      - 'register.html'
      - 'voter-help.html'
      - 'national-voter-registration-day.html'
      - 'rides-to-polls.html'
      - 'ride-board.html'
      - 'ride-board.js'
      - 'check-in.html'
      - 'check-in.js'
      - 'check-in-privacy.html'
      - 'voting-map.html'
      - 'voting-map.js'
      - 'map-state-actions.js'
      - 'home-map.js'
      - 'reminder-privacy.html'
      - 'app.js'
      - 'growth.js'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/site-ci.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'partner-kit.html'
      - 'register.html'
      - 'voter-help.html'
      - 'national-voter-registration-day.html'
      - 'rides-to-polls.html'
      - 'ride-board.html'
      - 'ride-board.js'
      - 'check-in.html'
      - 'check-in.js'
      - 'check-in-privacy.html'
      - 'voting-map.html'
      - 'voting-map.js'
      - 'map-state-actions.js'
      - 'home-map.js'
      - 'reminder-privacy.html'
      - 'app.js'
      - 'growth.js'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/site-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check growth.js
          node --check check-in.js
          node --check voting-map.js
          node --check map-state-actions.js
          node --check home-map.js
          node --check ride-board.js

      - name: Validate XML sitemap
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"

      - name: Verify crawl, privacy, check-in, map, ride, and growth files
        shell: bash
        run: |
          test -s robots.txt
          test -s sitemap.xml
          test -s growth.js
          test -s check-in.js
          test -s voting-map.js
          test -s map-state-actions.js
          test -s home-map.js
          test -s ride-board.html
          test -s ride-board.js
          grep -q 'rel="canonical" href="https://letsgovotethistime.com/"' index.html
          grep -q 'property="og:title"' index.html
          grep -q 'application/ld+json' index.html
          grep -q 'src="growth.js"' index.html
          grep -q 'src="home-map.js"' index.html
          grep -q 'id="heroMap"' index.html
          grep -q 'href="/voting-map"' index.html
          grep -q 'href="/check-in"' index.html
          grep -q 'rel="canonical" href="https://letsgovotethistime.com/check-in"' check-in.html
          grep -q 'I VOTED' check-in.html
          grep -q 'NOT YET' check-in.html
          grep -q 'lgvtt-vote-checkin' check-in.js
          grep -q 'crypto.randomUUID' check-in.js
          grep -q 'rel="canonical" href="https://letsgovotethistime.com/check-in-privacy"' check-in-privacy.html
          grep -q 'raw IP address is not stored' check-in-privacy.html
          grep -q 'rel="canonical" href="https://letsgovotethistime.com/voting-map"' voting-map.html
          grep -q 'OFFICIAL VOTING ACTIONS' voting-map.html
          grep -q 'official.votinginfotool.org' voting-map.html
          grep -q 'vote.gov/register' voting-map.html
          grep -q 'map-state-actions.js' voting-map.html
          grep -q 'SHARE THIS STATE VIEW' voting-map.html
          grep -q 'mobileStateSelect' voting-map.html
          grep -q 'mobile-checkin-bar' voting-map.html
          grep -q 'state-total-label' voting-map.js
          grep -q 'statePermalink' voting-map.js
          grep -q 'URLSearchParams' voting-map.js
          grep -q 'range(\[0,30\])' voting-map.js
          grep -q 'us-atlas@3' voting-map.js
          grep -q 'lgvtt-vote-checkin' voting-map.js
          grep -q 'exactPollingPlacesEnabled: false' map-state-actions.js
          grep -q 'HOME_CHECKIN_ENDPOINT' home-map.js
          grep -q 'rel="canonical" href="https://letsgovotethistime.com/partner-kit"' partner-kit.html
          grep -q 'rel="canonical" href="https://letsgovotethistime.com/register"' register.html
          grep -q 'rel="canonical" href="https://letsgovotethistime.com/voter-help"' voter-help.html
          grep -q 'rel="canonical" href="https://letsgovotethistime.com/national-voter-registration-day"' national-voter-registration-day.html
          grep -q 'rel="canonical" href="https://letsgovotethistime.com/rides-to-polls"' rides-to-polls.html
          grep -q 'YOU BOOK IT' rides-to-polls.html
          grep -q '2026 VOTER OFFER NOT YET VERIFIED' rides-to-polls.html
          grep -q 'href="/ride-board"' rides-to-polls.html
          grep -q 'src="growth.js"' rides-to-polls.html
          grep -q 'rel="canonical" href="https://letsgovotethistime.com/ride-board"' ride-board.html
          grep -q 'THE RIDE' ride-board.html
          grep -q 'PRIOR-CYCLE ONLY' ride-board.html
          grep -q 'FIND LOCAL 211' ride-board.html
          grep -q 'rideResourceForm' ride-board.html
          grep -q 'lgvtt-ride-resource-submit' ride-board.js
          grep -q 'ride_resource_submit_success' ride-board.js
          grep -q 'https://letsgovotethistime.com/ride-board' sitemap.xml
          grep -q 'rel="canonical" href="https://letsgovotethistime.com/reminder-privacy"' reminder-privacy.html
          grep -q 'FOUR OR FEWER' app.js
          grep -q 'reminderConsent' app.js
          grep -q 'lgvtt-reminders' app.js
          grep -q 'lgvtt-track' growth.js
          grep -q 'ride_provider_click' growth.js
          grep -q 'reminder_signup_success' growth.js
          grep -q 'Sitemap: https://letsgovotethistime.com/sitemap.xml' robots.txt
