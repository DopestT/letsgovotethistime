name: Apply SEO Pass

on:
  push:
    branches: [seo-pass-2026-09-08]
    paths:
      - 'scripts/apply_seo_pass.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: seo-pass-2026-09-08
          fetch-depth: 0

      - name: Apply SEO improvements
        run: python scripts/apply_seo_pass.py

      - name: Commit generated SEO changes
        run: |
          if git diff --quiet; then
            echo "No SEO changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html voting-map.html check-in.html ride-board.html rides-to-polls.html register.html voter-help.html national-voter-registration-day.html partner-kit.html sitemap.xml llms.txt
          git commit -m "Optimize voter resource SEO metadata and structured data"
          git push origin HEAD:seo-pass-2026-09-08
