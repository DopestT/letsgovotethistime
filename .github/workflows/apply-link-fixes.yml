name: Apply Verified Link Fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-link-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace unstable Uber deep links
        run: |
          sed -i 's#https://m\.uber\.com/looking#https://www.uber.com/us/en/ride/#g' index.html partner-kit.html ride-board.html
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo 'No link fixes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html partner-kit.html ride-board.html
          git commit -m 'Fix unstable Uber ride links'
          git push
