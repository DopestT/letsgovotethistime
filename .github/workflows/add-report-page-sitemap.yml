name: Add Report Page Sitemap
on:
  push:
    branches: [voter-guide-rules-reporting]
    paths:
      - 'scripts/add-report-page-sitemap.py'
      - '.github/workflows/add-report-page-sitemap.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voter-guide-rules-reporting
          fetch-depth: 0
      - run: python scripts/add-report-page-sitemap.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add election problem reporting page to sitemap"
          git push origin HEAD:voter-guide-rules-reporting
