name: CI Compatibility Markers
on:
  push:
    branches: [map-enhancements-all]
    paths:
      - 'scripts/ci_compat_markers.py'
      - '.github/workflows/ci-compat-markers.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: map-enhancements-all
      - run: python scripts/ci_compat_markers.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voting-map.html voting-map.js
          git commit -m "Preserve map CI compatibility markers"
          git push origin HEAD:map-enhancements-all
