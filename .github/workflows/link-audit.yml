name: Full Link Audit

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.xml'
      - '*.txt'
      - 'scripts/link-audit.mjs'
      - '.github/workflows/link-audit.yml'
  pull_request:
    paths:
      - '*.html'
      - '*.js'
      - '*.xml'
      - '*.txt'
      - 'scripts/link-audit.mjs'
      - '.github/workflows/link-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Full link report card
        run: node scripts/link-audit.mjs
